<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonlings — La Série Animée</title>
<script src="data/characters.js"></script>
<script src="data/episodes.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0a0520;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Stars background ── */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0.1; transform: scale(1); }
    100% { opacity: 1;   transform: scale(1.4); }
  }

  /* ── Layout ── */
  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 60px 20px 40px;
    background: linear-gradient(180deg, #1a0a3d 0%, transparent 100%);
  }
  .logo {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #FFD700, #FFA500, #FF6B6B, #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(255, 200, 0, 0.5));
  }
  .subtitle {
    font-size: 1.1rem;
    color: #C8A8FF;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  .moon-divider {
    font-size: 2rem;
    margin: 20px 0;
    filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.7));
  }

  /* ── Characters Section ── */
  .section-title {
    font-size: 1.8rem;
    text-align: center;
    color: #FFD700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 40px 0 30px;
  }

  .characters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 60px;
  }

  .character-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .character-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255, 215, 0, 0.5);
    box-shadow: 0 20px 40px rgba(255, 215, 0, 0.2);
    background: rgba(255,255,255,0.08);
  }
  .char-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    border: 3px solid rgba(255,255,255,0.2);
  }
  .char-name {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #FFD700;
  }
  .char-role {
    font-size: 0.75rem;
    color: #C8A8FF;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .char-catchphrase {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
    font-style: italic;
    line-height: 1.4;
  }
  .char-traits {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 10px;
  }
  .trait-tag {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.8);
  }

  /* ── Season Tabs ── */
  .season-tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
  }
  .season-tab {
    padding: 12px 32px;
    border-radius: 50px;
    border: 2px solid rgba(255, 215, 0, 0.4);
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.1em;
  }
  .season-tab.active, .season-tab:hover {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    border-color: #FFD700;
    color: #1a0a3d;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  }

  /* ── Episodes Grid ── */
  .episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 60px;
  }

  .episode-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .episode-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #FFD700, #FFA500);
    border-radius: 4px 0 0 4px;
  }
  .episode-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 215, 0, 0.4);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    background: rgba(255,255,255,0.08);
  }
  .ep-number {
    font-size: 0.75rem;
    color: #FFD700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .ep-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .ep-summary {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ep-characters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ep-char-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .ep-moral {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(255, 215, 0, 0.1);
    border-radius: 8px;
    font-size: 0.75rem;
    color: #FFD700;
    font-style: italic;
    border-left: 2px solid #FFD700;
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    overflow-y: auto;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 20px; }
  .modal {
    background: linear-gradient(135deg, #1a0a3d, #0d1a3d);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 24px;
    max-width: 800px;
    width: 100%;
    margin: auto;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
  }
  .modal-header {
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,100,0,0.15));
    padding: 30px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .modal-ep-num {
    font-size: 0.8rem;
    color: #FFD700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .modal-title {
    font-size: 2rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
  }
  .modal-summary {
    color: rgba(255,255,255,0.75);
    line-height: 1.7;
    font-size: 0.95rem;
  }
  .modal-body { padding: 30px; }
  .modal-moral {
    background: rgba(255, 215, 0, 0.1);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 30px;
    color: #FFD700;
    font-style: italic;
    font-size: 0.95rem;
  }
  .modal-moral strong { display: block; margin-bottom: 4px; font-style: normal; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }

  .scenes-title {
    font-size: 1rem;
    color: #C8A8FF;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .scene-block {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .scene-header {
    background: rgba(255,255,255,0.05);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .scene-num {
    background: #FFD700;
    color: #1a0a3d;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .scene-info { flex: 1; }
  .scene-title { font-weight: 600; font-size: 0.9rem; color: #fff; }
  .scene-location { font-size: 0.75rem; color: #C8A8FF; margin-top: 2px; }
  .scene-action {
    padding: 12px 16px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.5);
    font-style: italic;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .dialogue-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .dialogue-line { display: flex; gap: 12px; align-items: flex-start; }
  .dialogue-char {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #FFD700;
    min-width: 80px;
    padding-top: 2px;
  }
  .dialogue-text {
    font-size: 0.875rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
    flex: 1;
  }

  .modal-close {
    display: block;
    margin: 20px auto 0;
    padding: 12px 40px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    border: none;
    border-radius: 50px;
    color: #1a0a3d;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .modal-close:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.3);
    font-size: 0.85rem;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  /* ── Character colors ── */
  .char-mochi  { background-color: rgba(245, 230, 200, 0.15); color: #F5E6C8; border-color: #D4A855; }
  .char-piri   { background-color: rgba(255, 215, 0, 0.15);   color: #FFD700; border-color: #FFD700; }
  .char-pofu   { background-color: rgba(200, 230, 240, 0.15); color: #C8E6F0; border-color: #7FBFD4; }
  .char-zumu   { background-color: rgba(91, 184, 245, 0.15);  color: #5BB8F5; border-color: #5BB8F5; }
  .char-gizo   { background-color: rgba(126, 212, 164, 0.15); color: #7ED4A4; border-color: #7ED4A4; }

  .char-badge-mochi { background: rgba(212, 168, 85, 0.2); color: #D4A855; }
  .char-badge-piri  { background: rgba(255, 215, 0, 0.2);  color: #FFD700; }
  .char-badge-pofu  { background: rgba(127, 191, 212, 0.2);color: #7FBFD4; }
  .char-badge-zumu  { background: rgba(91, 184, 245, 0.2); color: #5BB8F5; }
  .char-badge-gizo  { background: rgba(126, 212, 164, 0.2);color: #7ED4A4; }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Header -->
<header>
  <div class="logo">MOONLINGS</div>
  <div class="subtitle">La Série Animée des Étoiles</div>
  <div class="moon-divider">🌙 ⭐ 🌟 ⭐ 🌙</div>
</header>

<div class="container">

  <!-- Characters -->
  <h2 class="section-title">✨ Les Personnages</h2>
  <div class="characters-grid" id="characters-grid"></div>

  <!-- Episodes -->
  <h2 class="section-title">🎬 Les Épisodes</h2>
  <div class="season-tabs">
    <button class="season-tab active" onclick="filterSeason(1, this)">Saison 1</button>
    <button class="season-tab" onclick="filterSeason(2, this)">Saison 2</button>
    <button class="season-tab" onclick="filterSeason(0, this)">Tous</button>
  </div>
  <div class="episodes-grid" id="episodes-grid"></div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<footer>
  <p>🌙 Moonlings — Série animée pour enfants · Saison 1 & 2 · Personnages : Mochi, Piri, Pofu, Zumu, Gizo 🌟</p>
</footer>

<script>
// ── Generate stars ──
const starsEl = document.getElementById('stars');
for (let i = 0; i < 150; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 3 + 1;
  s.style.cssText = `
    width: ${size}px; height: ${size}px;
    top: ${Math.random() * 100}%;
    left: ${Math.random() * 100}%;
    --d: ${(Math.random() * 4 + 1).toFixed(1)}s;
    animation-delay: ${(Math.random() * 5).toFixed(1)}s;
  `;
  starsEl.appendChild(s);
}

// ── Character emojis ──
const charEmoji = { mochi: '🌙', piri: '⭐', pofu: '☁️', zumu: '💫', gizo: '🔧' };

// ── Render characters ──
function renderCharacters() {
  const grid = document.getElementById('characters-grid');
  // Support both variable names
  const chars = typeof moonlingsCharacters !== 'undefined' ? moonlingsCharacters
              : typeof CHARACTERS !== 'undefined' ? Object.values(CHARACTERS) : [];
  chars.forEach(c => {
    const id = c.name.toLowerCase();
    const traits = (c.personality || c.traits || []).slice(0, 3);
    grid.innerHTML += `
      <div class="character-card">
        <div class="char-avatar" style="background: ${c.color}22; border-color: ${c.color}44;">
          ${charEmoji[id] || '✨'}
        </div>
        <div class="char-name" style="color: ${c.color};">${c.name}</div>
        <div class="char-role">${c.role || ''}</div>
        <div class="char-catchphrase">"${c.catchphrase}"</div>
        <div class="char-traits">
          ${traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
        </div>
      </div>`;
  });
}

// ── Render episodes ──
let currentSeason = 1;

function renderEpisodes(season) {
  const grid = document.getElementById('episodes-grid');
  const allEps = typeof moonlingsEpisodes !== 'undefined' ? moonlingsEpisodes
               : typeof EPISODES !== 'undefined' ? EPISODES : [];
  const filtered = season === 0 ? allEps : allEps.filter(e => e.season === season);
  grid.innerHTML = filtered.map(ep => {
    const chars = (ep.characters || []).map(c =>
      `<span class="ep-char-badge char-badge-${c.toLowerCase()}">${c}</span>`
    ).join('');
    const epNum = ep.episode || ep.episodeNumber || ep.id;
    return `
      <div class="episode-card" onclick="openModal(${ep.id})">
        <div class="ep-number">S${ep.season} · EP ${epNum < 10 ? '0' + epNum : epNum}</div>
        <div class="ep-title">${ep.title}</div>
        <div class="ep-summary">${ep.summary}</div>
        <div class="ep-characters">${chars}</div>
        <div class="ep-moral">💡 ${ep.moral}</div>
      </div>`;
  }).join('');
}

function filterSeason(s, btn) {
  currentSeason = s;
  document.querySelectorAll('.season-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEpisodes(s);
}

// ── Modal ──
function openModal(id) {
  const allEps = typeof moonlingsEpisodes !== 'undefined' ? moonlingsEpisodes
               : typeof EPISODES !== 'undefined' ? EPISODES : [];
  const ep = allEps.find(e => e.id === id);
  if (!ep) return;
  const chars = (ep.characters || []).map(c =>
    `<span class="ep-char-badge char-badge-${c.toLowerCase()}" style="padding:4px 12px;border-radius:20px;font-size:0.8rem;">${c}</span>`
  ).join('');
  const epNum2 = ep.episode || ep.episodeNumber || ep.id;
  const scenes = (ep.scenes || []).map((sc, si) => {
    const dialogues = (sc.dialogue || []).map(d =>
      `<div class="dialogue-line">
        <span class="dialogue-char">${d.character}</span>
        <span class="dialogue-text">${d.text}</span>
      </div>`
    ).join('');
    return `
      <div class="scene-block">
        <div class="scene-header">
          <div class="scene-num">${sc.scene || si + 1}</div>
          <div class="scene-info">
            <div class="scene-title">${sc.title}</div>
            <div class="scene-location">📍 ${sc.location}</div>
          </div>
        </div>
        ${sc.action ? `<div class="scene-action">${sc.action}</div>` : ''}
        <div class="dialogue-list">${dialogues}</div>
      </div>`;
  }).join('');

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div class="modal-ep-num">Saison ${ep.season} · Épisode ${epNum2 < 10 ? '0' + epNum2 : epNum2}</div>
      <div class="modal-title">${ep.title}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">${chars}</div>
      <div class="modal-summary">${ep.summary}</div>
    </div>
    <div class="modal-body">
      <div class="modal-moral">
        <strong>🌟 La Leçon</strong>
        ${ep.moral}
      </div>
      <div class="scenes-title">🎬 Les Scènes</div>
      ${scenes}
      <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">
        ✕ Fermer
      </button>
    </div>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
});

// ── Init ──
renderCharacters();
renderEpisodes(1);
</script>
</body>
</html>
