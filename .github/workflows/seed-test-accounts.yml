name: Seed Test Accounts

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create test accounts in Supabase
        run: |
          SUPABASE_URL="https://ctyrpbkicfswuabmuqxc.supabase.co"
          ANON_KEY="sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX"

          create_user() {
            EMAIL=$1; PASSWORD=$2; NAME=$3; TYPE=$4
            echo "Creating $EMAIL..."
            curl -s -X POST "$SUPABASE_URL/auth/v1/signup" \
              -H "apikey: $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"data\":{\"name\":\"$NAME\",\"profile_type\":\"$TYPE\"}}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK:', d.get('user',{}).get('id','already exists or error'))"
          }

          create_user "test-ado@capsule.app"    "Capsule2026!" "Alex"       "ado"
          create_user "test-parent@capsule.app" "Capsule2026!" "Marie"      "parent"
          create_user "test-pro@capsule.app"    "Capsule2026!" "Dr. Thomas" "pro"
          create_user "goocciland@gmail.com"    "Capsule2026!" "Admin"      "ado"

          echo "Done. Check Supabase Authentication > Users to confirm."
