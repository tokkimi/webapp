name: Deploy Capsule

on:
  push:
    branches:
      - claude/affectionate-maxwell-10fo6z
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CAPSULE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      NEXT_PUBLIC_SUPABASE_URL: https://ctyrpbkicfswuabmuqxc.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Set env vars on Vercel project
        run: |
          set_env() { echo "$2" | vercel env add "$1" production --token=$VERCEL_TOKEN --force 2>/dev/null || true; }
          set_env NEXT_PUBLIC_SUPABASE_URL "https://ctyrpbkicfswuabmuqxc.supabase.co"
          set_env NEXT_PUBLIC_SUPABASE_ANON_KEY "sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX"
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            set_env ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            set_env SUPABASE_SERVICE_ROLE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          fi

      - name: Apply SQL schema via Supabase Management API
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="ctyrpbkicfswuabmuqxc"
          SUPA_URL="https://ctyrpbkicfswuabmuqxc.supabase.co"

          # Try Management API first (needs SUPABASE_ACCESS_TOKEN personal access token)
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Applying schema via Supabase Management API..."
            SCHEMA=$(cat supabase/schema.sql | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            RESULT=$(curl -s -o /tmp/schema_result.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": $SCHEMA}")
            echo "Management API response: $RESULT"
            cat /tmp/schema_result.json
          elif [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Trying exec_sql RPC with service role key..."
            SCHEMA=$(cat supabase/schema.sql | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            curl -s -X POST "$SUPA_URL/rest/v1/rpc/exec_sql" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"sql\": $SCHEMA}" || true
          else
            echo "No Supabase credentials for DDL — schema must be applied manually in Supabase SQL Editor"
          fi

      - name: Create test accounts in Supabase
        run: |
          SUPA_URL="https://ctyrpbkicfswuabmuqxc.supabase.co"
          ANON_KEY="sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX"
          create_user() {
            echo "Seeding $1..."
            curl -s -X POST "$SUPA_URL/auth/v1/signup" \
              -H "apikey: $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$1\",\"password\":\"$2\",\"data\":{\"name\":\"$3\",\"profile_type\":\"$4\"}}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); u=d.get('user'); print('Created' if u else 'Already exists or error:', d.get('msg',''))" 2>/dev/null || echo "Skipped $1"
          }
          create_user "test-ado@capsule.app"    "Capsule2026!" "Alex"       "ado"
          create_user "test-parent@capsule.app" "Capsule2026!" "Marie"      "parent"
          create_user "test-pro@capsule.app"    "Capsule2026!" "Dr. Thomas" "pro"

      - name: Deploy to Vercel (Capsule)
        id: deploy
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "Deployed Capsule to: $URL"
          echo "deploy_url=$URL" >> $GITHUB_OUTPUT

      - name: Bootstrap database via deployed API
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.deploy_url }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://webapp-chi-five-94.vercel.app"
          fi
          echo "Calling setup-db on $DEPLOY_URL..."
          sleep 10
          curl -s -X POST "$DEPLOY_URL/api/setup-db" \
            -H "Content-Type: application/json" \
            --max-time 30 | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))" 2>/dev/null || echo "setup-db call done (may need service key on Vercel)"
