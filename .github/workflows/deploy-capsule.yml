name: Deploy Capsule

on:
  push:
    branches:
      - claude/affectionate-maxwell-10fo6z
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CAPSULE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      NEXT_PUBLIC_SUPABASE_URL: https://ctyrpbkicfswuabmuqxc.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Set Supabase env vars on Vercel project
        run: |
          echo "https://ctyrpbkicfswuabmuqxc.supabase.co" | vercel env add NEXT_PUBLIC_SUPABASE_URL production --token=$VERCEL_TOKEN --force 2>/dev/null || true
          echo "https://ctyrpbkicfswuabmuqxc.supabase.co" | vercel env add NEXT_PUBLIC_SUPABASE_URL preview --token=$VERCEL_TOKEN --force 2>/dev/null || true
          echo "sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX" | vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY production --token=$VERCEL_TOKEN --force 2>/dev/null || true
          echo "sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX" | vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY preview --token=$VERCEL_TOKEN --force 2>/dev/null || true

      - name: Set Anthropic API key on Vercel
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "${{ secrets.ANTHROPIC_API_KEY }}" | vercel env add ANTHROPIC_API_KEY production --token=$VERCEL_TOKEN --force 2>/dev/null || true
            echo "${{ secrets.ANTHROPIC_API_KEY }}" | vercel env add ANTHROPIC_API_KEY preview --token=$VERCEL_TOKEN --force 2>/dev/null || true
          fi

      - name: Apply SQL schema to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not set, skipping schema migration"
            exit 0
          fi
          SUPA_URL="https://ctyrpbkicfswuabmuqxc.supabase.co"
          # Apply schema via Supabase REST (exec_sql RPC must exist, or use pg endpoint)
          # Use the Management API approach: POST to /rest/v1/rpc/exec_sql won't work without the function
          # Instead apply each CREATE TABLE via direct SQL using service_role key with pg endpoint
          apply_sql() {
            curl -s -X POST "$SUPA_URL/rest/v1/rpc/exec_sql" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"sql\": $(echo "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
              2>/dev/null || true
          }
          # Read and apply schema
          SCHEMA=$(cat supabase/schema.sql)
          echo "Applying schema via Supabase..."
          apply_sql "$SCHEMA"
          echo "Schema migration step complete."

      - name: Create test accounts in Supabase
        run: |
          SUPA_URL="https://ctyrpbkicfswuabmuqxc.supabase.co"
          ANON_KEY="sb_publishable_GWLgJZXC6_3AXl2HtVKuOQ_OOvAKORX"
          create_user() {
            echo "Seeding $1..."
            curl -s -X POST "$SUPA_URL/auth/v1/signup" \
              -H "apikey: $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$1\",\"password\":\"$2\",\"data\":{\"name\":\"$3\",\"profile_type\":\"$4\"}}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); u=d.get('user'); print('Created' if u else 'Already exists or error:', d.get('msg',''))" 2>/dev/null || echo "Skipped $1"
          }
          create_user "test-ado@capsule.app"    "Capsule2026!" "Alex"       "ado"
          create_user "test-parent@capsule.app" "Capsule2026!" "Marie"      "parent"
          create_user "test-pro@capsule.app"    "Capsule2026!" "Dr. Thomas" "pro"

      - name: Deploy to Vercel (Capsule)
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "Deployed Capsule to: $URL"
